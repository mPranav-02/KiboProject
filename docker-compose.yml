# Local runtime: app + MySQL (source of truth) + Redis (cache only) + RabbitMQ (events only).
# `docker compose up --build` works on a fresh clone. No hosts or credentials are written here (Constitution XIV):
# every service reads the committed, LOCAL-ONLY placeholders in .env.example, and then an optional .env
# (gitignored), whose values win. To change anything, copy .env.example to .env and edit it.
# The infrastructure images expect their own variable names, so each one maps them from the shared
# DB_* / REDIS_* / RABBITMQ_* names at container start ($$ = evaluated inside the container).

x-env-files: &env-files
  - path: .env.example
  - path: .env
    required: false

services:
  app:
    build: .
    env_file: *env-files
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8.4
    env_file: *env-files
    environment:
      MYSQL_DATABASE: kibo
    entrypoint:
      - sh
      - -c
      - 'export MYSQL_USER="$$DB_USERNAME" MYSQL_PASSWORD="$$DB_PASSWORD"; exec docker-entrypoint.sh mysqld'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping (-h 127.0.0.1) only succeeds once the real server is up, not the init-time server.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7
    env_file: *env-files
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    env_file: *env-files
    entrypoint:
      - sh
      - -c
      - 'export RABBITMQ_DEFAULT_USER="$$RABBITMQ_USERNAME" RABBITMQ_DEFAULT_PASS="$$RABBITMQ_PASSWORD"; exec docker-entrypoint.sh rabbitmq-server'
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
